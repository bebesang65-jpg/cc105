<script>

/* =========================
   BASE64 FUNCTIONS
========================= */

function toBase64(buffer) {

  const bytes = new Uint8Array(buffer);

  let binary = "";

  for (let i = 0; i < bytes.length; i++) {
    binary += String.fromCharCode(bytes[i]);
  }

  return btoa(binary);
}


function fromBase64(base64) {

  const binary = atob(base64);

  const bytes =
    new Uint8Array(binary.length);

  for (let i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }

  return bytes;
}


/* =========================
   GENERATE AES-256 KEY
========================= */

async function generateKey() {

  return crypto.subtle.generateKey(

    {
      name: "AES-GCM",
      length: 256
    },

    true,

    ["encrypt", "decrypt"]

  );

}


/* =========================
   ENCRYPT MESSAGE
========================= */

async function encryptMessage(
  message,
  key
) {

  const encoder =
    new TextEncoder();

  const data =
    encoder.encode(message);


  // Random 12-byte IV
  const iv =
    crypto.getRandomValues(
      new Uint8Array(12)
    );


  const encrypted =
    await crypto.subtle.encrypt(

      {
        name: "AES-GCM",
        iv: iv
      },

      key,

      data

    );


  const ivBase64 =
    toBase64(iv);

  const encryptedBase64 =
    toBase64(encrypted);


  /*
    Store IV + ciphertext together.
  */

  return ivBase64 +
         "." +
         encryptedBase64;
}


/* =========================
   DECRYPT MESSAGE
========================= */

async function decryptMessage(
  ciphertext,
  secretKey
) {

  const parts =
    ciphertext.split(".");

  if (parts.length !== 2) {
    throw new Error(
      "Invalid ciphertext."
    );
  }


  const iv =
    fromBase64(parts[0]);

  const encrypted =
    fromBase64(parts[1]);


  const rawKey =
    fromBase64(secretKey);


  const key =
    await crypto.subtle.importKey(

      "raw",

      rawKey,

      {
        name: "AES-GCM"
      },

      false,

      ["decrypt"]

    );


  const decrypted =
    await crypto.subtle.decrypt(

      {
        name: "AES-GCM",
        iv: iv
      },

      key,

      encrypted

    );


  return new TextDecoder()
    .decode(decrypted);
}


/* =========================
   CREATE MESSAGE
========================= */

async function createMessage() {

  const username =
    document
      .getElementById("username")
      .value
      .trim();

  const message =
    document
      .getElementById("message")
      .value
      .trim();


  if (!username) {
    alert("Enter your username.");
    return;
  }


  if (!message) {
    alert("Enter a message.");
    return;
  }


  try {

    // Generate AES-256 key
    const key =
      await generateKey();


    // Encrypt message
    const ciphertext =
      await encryptMessage(
        message,
        key
      );


    // Export secret key
    const rawKey =
      await crypto.subtle.exportKey(
        "raw",
        key
      );


    const secretKey =
      toBase64(rawKey);


    /*
      Save to Google Spreadsheet.

      Columns:

      Timestamp
      Username
      Ciphertext
      Plaintext
      Key
    */

    google.script.run

      .withSuccessHandler(function() {

        document
          .getElementById("secretKey")
          .textContent =
          secretKey;

        document
          .getElementById("keyBox")
          .style.display =
          "block";


        document
          .getElementById("message")
          .value = "";


        alert(
          "Message successfully published!"
        );


        loadMessages();

      })

      .withFailureHandler(function(error) {

        alert(
          "Error: " +
          error.message
        );

      })

      .saveMessage(

        username,
        ciphertext,
        message,
        secretKey

      );


  } catch (error) {

    alert(
      "Encryption error: " +
      error.message
    );

  }

}


/* =========================
   LOAD PUBLIC FEED
========================= */

function loadMessages() {

  google.script.run

    .withSuccessHandler(function(messages) {

      displayMessages(messages);

    })

    .withFailureHandler(function(error) {

      document
        .getElementById("feed")
        .innerHTML =
        "<p class='error'>" +
        error.message +
        "</p>";

    })

    .getPublicMessages();

}


/* =========================
   DISPLAY FEED
========================= */

function displayMessages(messages) {

  const feed =
    document.getElementById("feed");


  if (!messages ||
      messages.length === 0) {

    feed.innerHTML =
      "<p>No messages yet.</p>";

    return;
  }


  feed.innerHTML = "";


  messages.forEach(function(item) {

    const div =
      document.createElement("div");

    div.className =
      "message";


    const time =
      new Date(item.timestamp)
        .toLocaleString();


    div.innerHTML = `

      <div class="username">
        👤 ${escapeHtml(item.username)}
      </div>

      <div class="time">
        ${escapeHtml(time)}
      </div>

      <p>
        🔐 AES-256-GCM
      </p>

      <div class="ciphertext">
        ${escapeHtml(item.ciphertext)}
      </div>

      <br>

      <label>
        Secret Key
      </label>

      <input
        class="decrypt-key"
        placeholder="Enter secret key"
      >

      <button class="decrypt">
        🔓 Try to Decrypt
      </button>

      <div class="result"></div>
    `;


    const input =
      div.querySelector(
        ".decrypt-key"
      );

    const button =
      div.querySelector(
        ".decrypt"
      );

    const result =
      div.querySelector(
        ".result"
      );


    button.onclick =
      async function() {

        const key =
          input.value.trim();


        if (!key) {

          result.innerHTML =
            "<span class='error'>" +
            "Enter a secret key." +
            "</span>";

          return;
        }


        try {

          const plaintext =
            await decryptMessage(
              item.ciphertext,
              key
            );


          result.innerHTML =
            "<strong>✅ Message:</strong><br>" +
            escapeHtml(plaintext);

        } catch (error) {

          result.innerHTML =
            "<span class='error'>" +
            "❌ Wrong key or invalid ciphertext." +
            "</span>";

        }

      };


    feed.appendChild(div);

  });

}


/* =========================
   COPY KEY
========================= */

function copyKey() {

  const key =
    document
      .getElementById("secretKey")
      .textContent;


  navigator.clipboard
    .writeText(key);

  alert(
    "Secret key copied!"
  );

}


/* =========================
   SECURITY
========================= */

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;

}


/* =========================
   START
========================= */

loadMessages();

</script>
