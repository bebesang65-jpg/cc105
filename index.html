<script>

const DEFAULT_WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbws9yfTj46Z7oRDJqvSwqII5mg7n7JxvlCtMprCsOYuwot9UoewicuG0XtgtJsRQUgr/exec";


/* ==================================================
   GET WEB APP URL
================================================== */

function getWebAppUrl() {

  const saved = localStorage.getItem("webAppUrl");

  if (saved) {
    return saved;
  }

  const input = document.getElementById("webAppUrl");

  if (input && input.value.trim()) {
    return input.value.trim();
  }

  return DEFAULT_WEB_APP_URL;
}


/* ==================================================
   BASE64
================================================== */

function toBase64(buffer) {

  const bytes = new Uint8Array(buffer);

  let binary = "";

  for (let i = 0; i < bytes.length; i++) {
    binary += String.fromCharCode(bytes[i]);
  }

  return btoa(binary);
}


function fromBase64(base64) {

  const binary = atob(base64);

  const bytes = new Uint8Array(binary.length);

  for (let i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }

  return bytes;
}


/* ==================================================
   GENERATE AES-256-GCM KEY
================================================== */

async function generateKey() {

  return crypto.subtle.generateKey(
    {
      name: "AES-GCM",
      length: 256
    },
    true,
    ["encrypt", "decrypt"]
  );

}


/* ==================================================
   ENCRYPT MESSAGE
================================================== */

async function encryptMessage(message, key) {

  const encoder = new TextEncoder();

  const data = encoder.encode(message);

  // AES-GCM uses a 12-byte IV
  const iv = crypto.getRandomValues(
    new Uint8Array(12)
  );

  const encrypted = await crypto.subtle.encrypt(
    {
      name: "AES-GCM",
      iv: iv
    },
    key,
    data
  );

  /*
    ciphertext format:

    Base64(IV).Base64(EncryptedData)
  */

  return (
    toBase64(iv) +
    "." +
    toBase64(encrypted)
  );
}


/* ==================================================
   DECRYPT MESSAGE
================================================== */

async function decryptMessage(
  ciphertext,
  secretKey
) {

  const parts = ciphertext.split(".");

  if (parts.length !== 2) {
    throw new Error("Invalid ciphertext.");
  }

  const iv = fromBase64(parts[0]);

  const encrypted = fromBase64(parts[1]);

  const rawKey = fromBase64(secretKey);

  if (rawKey.length !== 32) {
    throw new Error(
      "Invalid AES-256 secret key."
    );
  }

  const key = await crypto.subtle.importKey(
    "raw",
    rawKey,
    {
      name: "AES-GCM"
    },
    false,
    ["decrypt"]
  );

  const decrypted =
    await crypto.subtle.decrypt(
      {
        name: "AES-GCM",
        iv: iv
      },
      key,
      encrypted
    );

  return new TextDecoder().decode(
    decrypted
  );
}


/* ==================================================
   CREATE MESSAGE
================================================== */

async function createMessage() {

  const username =
    document
      .getElementById("username")
      .value
      .trim();

  const message =
    document
      .getElementById("message")
      .value
      .trim();

  const keyBox =
    document.getElementById("keyBox");

  const secretKeyElement =
    document.getElementById("secretKey");

  const publishButton =
    document.getElementById("publishButton");

  const status =
    document.getElementById(
      "connectionStatus"
    );


  /* ===============================
     VALIDATION
  =============================== */

  if (!username) {

    alert(
      "Please enter your username."
    );

    return;
  }


  if (!message) {

    alert(
      "Please enter your message."
    );

    return;
  }


  const url = getWebAppUrl();


  if (!url) {

    alert(
      "Please enter your Apps Script Web App URL."
    );

    return;
  }


  try {

    publishButton.disabled = true;

    publishButton.textContent =
      "🔐 Encrypting...";


    /* ===============================
       1. GENERATE AES KEY
    =============================== */

    const key =
      await generateKey();


    /* ===============================
       2. ENCRYPT MESSAGE
    =============================== */

    const ciphertext =
      await encryptMessage(
        message,
        key
      );


    /* ===============================
       3. EXPORT SECRET KEY
    =============================== */

    const rawKey =
      await crypto.subtle.exportKey(
        "raw",
        key
      );

    const secretKey =
      toBase64(rawKey);


    /*
      IMPORTANT:

      DISPLAY SECRET KEY IMMEDIATELY
    */

    secretKeyElement.textContent =
      secretKey;

    keyBox.style.display =
      "block";


    /* ===============================
       4. PREPARE DATA
    =============================== */

    const data = {

      action: "save",

      username: username,

      ciphertext: ciphertext,

      plaintext: message,

      key: secretKey

    };


    console.log(
      "Sending data:",
      data
    );


    /* ===============================
       5. SEND TO GOOGLE APPS SCRIPT
    =============================== */

    publishButton.textContent =
      "📤 Publishing...";


    fetch(
      url,
      {
        method: "POST",

        mode: "no-cors",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body: JSON.stringify(data)
      }
    )
    .then(function() {

      status.textContent =
        "✅ Message sent to Google Apps Script";

      status.className =
        "connection-success";

    })
    .catch(function(error) {

      console.error(error);

      status.textContent =
        "⚠️ Check Google Apps Script";

      status.className =
        "connection-warning";

    });


    /* ===============================
       6. CLEAR MESSAGE
    =============================== */

    document
      .getElementById("message")
      .value = "";


    /* ===============================
       7. SHOW KEY
    =============================== */

    alert(
      "✅ Message encrypted and published!\n\n" +
      "🔑 Your Secret Key:\n\n" +
      secretKey +
      "\n\n" +
      "⚠️ SAVE THIS KEY!"
    );


    publishButton.disabled = false;

    publishButton.textContent =
      "🔒 Encrypt & Publish";


    /* ===============================
       8. REFRESH FEED
    =============================== */

    setTimeout(
      function() {
        loadMessages();
      },
      2000
    );


  } catch (error) {

    console.error(error);

    publishButton.disabled = false;

    publishButton.textContent =
      "🔒 Encrypt & Publish";

    alert(
      "❌ Encryption Error:\n\n" +
      error.message
    );

  }

}


/* ==================================================
   COPY SECRET KEY
================================================== */

function copyKey() {

  const key =
    document
      .getElementById("secretKey")
      .textContent
      .trim();

  if (!key) {

    alert(
      "No secret key available."
    );

    return;
  }


  navigator.clipboard
    .writeText(key)
    .then(function() {

      alert(
        "🔑 Secret key copied!"
      );

    })
    .catch(function() {

      const textarea =
        document.createElement(
          "textarea"
        );

      textarea.value = key;

      document.body.appendChild(
        textarea
      );

      textarea.select();

      document.execCommand(
        "copy"
      );

      document.body.removeChild(
        textarea
      );

      alert(
        "🔑 Secret key copied!"
      );

    });

}


/* ==================================================
   ESCAPE HTML
================================================== */

function escapeHtml(text) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    String(text ?? "");

  return div.innerHTML;
}


/* ==================================================
   LOAD MESSAGES
================================================== */

function loadMessages() {

  const url =
    getWebAppUrl();

  const feed =
    document.getElementById(
      "feed"
    );

  if (!url) {

    feed.innerHTML =
      "<p class='error'>" +
      "❌ Apps Script URL is missing." +
      "</p>";

    return;
  }


  feed.innerHTML =
    "<div class='loading'>" +
    "🔄 Loading messages..." +
    "</div>";


  const callbackName =
    "aesCallback_" +
    Date.now();


  window[callbackName] =
    function(result) {

      try {

        if (
          !result ||
          !result.success
        ) {

          throw new Error(
            result &&
            result.error
              ? result.error
              : "Unable to load messages."
          );
        }


        displayMessages(
          result.messages
        );


      } catch (error) {

        feed.innerHTML =
          "<p class='error'>" +
          "❌ " +
          escapeHtml(
            error.message
          ) +
          "</p>";

      }


      cleanup();

    };


  function cleanup() {

    if (script.parentNode) {

      script.parentNode
        .removeChild(script);

    }

    delete window[
      callbackName
    ];

  }


  const script =
    document.createElement(
      "script"
    );


  script.src =
    url +
    "?action=getMessages" +
    "&callback=" +
    encodeURIComponent(
      callbackName
    ) +
    "&t=" +
    Date.now();


  script.onerror =
    function() {

      feed.innerHTML =
        "<p class='error'>" +
        "❌ Cannot connect to Google Apps Script." +
        "</p>";

      cleanup();

    };


  document.body.appendChild(
    script
  );

}


/* ==================================================
   DISPLAY MESSAGES
================================================== */

function displayMessages(messages) {

  const feed =
    document.getElementById(
      "feed"
    );


  if (
    !messages ||
    messages.length === 0
  ) {

    feed.innerHTML =
      "<div class='empty'>" +
      "📭 No encrypted messages yet." +
      "</div>";

    return;
  }


  feed.innerHTML = "";


  messages.forEach(
    function(item) {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "message";


      const timestamp =
        item.timestamp
          ? new Date(
              item.timestamp
            ).toLocaleString()
          : "Unknown time";


      div.innerHTML = `

        <div class="username">
          👤 ${escapeHtml(
            item.username ||
            "Anonymous"
          )}
        </div>

        <div class="time">
          ${escapeHtml(
            timestamp
          )}
        </div>

        <p class="info">
          🔐 Cipher:
          <strong>AES-256-GCM</strong>
        </p>

        <div class="ciphertext">
          ${escapeHtml(
            item.ciphertext || ""
          )}
        </div>

        <br>

        <label>
          🔑 Secret Key
        </label>

        <input
          class="decrypt-key"
          type="text"
          placeholder="Enter secret key"
          autocomplete="off"
        >

        <button class="decrypt">
          🔓 Try to Decrypt
        </button>

        <div
          class="result"
          style="display:none;"
        ></div>

      `;


      const input =
        div.querySelector(
          ".decrypt-key"
        );


      const button =
        div.querySelector(
          ".decrypt"
        );


      const result =
        div.querySelector(
          ".result"
        );


      button.onclick =
        async function() {

          const secretKey =
            input.value.trim();


          if (!secretKey) {

            result.style.display =
              "block";

            result.innerHTML =
              "<span class='error'>" +
              "❌ Please enter the secret key." +
              "</span>";

            return;
          }


          try {

            button.disabled = true;

            button.textContent =
              "🔓 Decrypting...";


            const plaintext =
              await decryptMessage(
                item.ciphertext,
                secretKey
              );


            result.style.display =
              "block";


            result.innerHTML =
              "<strong>" +
              "✅ Decrypted Message:" +
              "</strong>" +
              "<br><br>" +
              escapeHtml(
                plaintext
              );


          } catch (error) {

            result.style.display =
              "block";


            result.innerHTML =
              "<span class='error'>" +
              "❌ Wrong key or invalid ciphertext." +
              "</span>";

          }


          button.disabled =
            false;

          button.textContent =
            "🔓 Try to Decrypt";

        };


      feed.appendChild(
        div
      );

    }
  );

}


/* ==================================================
   START
================================================== */

window.addEventListener(
  "load",
  function() {

    const input =
      document.getElementById(
        "webAppUrl"
      );

    const saved =
      localStorage.getItem(
        "webAppUrl"
      );

    if (
      saved &&
      input
    ) {

      input.value =
        saved;

    }

    loadMessages();

  }
);

</script>
